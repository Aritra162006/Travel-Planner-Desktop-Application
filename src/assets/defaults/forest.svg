<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="forestSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#84fab0" />
      <stop offset="100%" stop-color="#8fd3f4" />
    </linearGradient>
  </defs>
  <rect width="600" height="400" fill="url(#forestSky)" />
  <!-- Trees background -->
  <polygon points="120,160 60,280 180,280" fill="#2d6a4f" opacity="0.7" />
  <polygon points="260,140 190,280 330,280" fill="#1b4332" opacity="0.7" />
  <polygon points="450,150 380,290 520,290" fill="#2d6a4f" opacity="0.7" />
  <!-- Trees foreground -->
  <polygon points="180,180 100,340 260,340" fill="#40916c" />
  <rect x="170" y="340" width="20" height="40" fill="#78350f" />
  <polygon points="350,170 270,330 430,330" fill="#52b788" />
  <rect x="340" y="330" width="20" height="50" fill="#78350f" />
  <text x="300" y="380" text-anchor="middle" font-family="sans-serif" font-weight="bold" font-size="28" fill="#1e293b">Nature & Forest</text>
</svg>
